services:
  db:
    image: postgres:16-alpine
    container_name: lms-lab-db
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: lms
    ports: ["5433:5432"]
    volumes: ["lms-lab-pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  lms-lab-pgdata:
